name: Package DEB

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            build-essential \
            pkg-config \
            gettext \
            xsltproc \
            docbook-xsl \
            libglib2.0-dev \
            libgtk-3-dev \
            libvte-2.91-dev \
            libpcre2-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            libx11-dev

      - name: Build .deb
        run: packaging/build-deb.sh packaging/out

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: termshare-deb
          path: packaging/out/*.deb
          if-no-files-found: error
