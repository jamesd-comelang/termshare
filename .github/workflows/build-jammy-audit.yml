name: Build Jammy Audit

# Temporary audit only: does the code compile and link against
# Ubuntu 22.04 (libxfce4ui/libxfce4kbd 4.16) headers and libraries?
# This is NOT the shipping build, which stays on ubuntu-24.04.
# Delete this workflow once the 4.16 vs 4.18 audit is done.

on:
  push:
    branches: [termshare/jammy-audit]
  workflow_dispatch:

jobs:
  build-jammy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            build-essential \
            pkg-config \
            gettext \
            xsltproc \
            docbook-xsl \
            libglib2.0-dev \
            libgtk-3-dev \
            libvte-2.91-dev \
            libpcre2-dev \
            libxfce4ui-2-dev \
            libxfconf-0-dev \
            libx11-dev

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Check binaries
        run: |
          test -x build/terminal/termshare
          test -x build/terminal/termshare-client
          ls -lh build/terminal/termshare build/terminal/termshare-client
